<!doctype html>
<!-- Replaces Expo's default web template: @expo/cli (webTemplate.js) reads public/index.html
     first. Its language and title placeholders are substituted once each, by String.replace,
     so neither may be written anywhere else in this file -- not even in a comment. -->
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>%WEB_TITLE%</title>
    <!-- Installable from the browser: the manifest, the home-screen icon, and a status bar
         that matches the app. Icons come from assets/icon.png via npm run web:icons. -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- The browser chrome takes the page colour, light or dark, so the app has no frame. -->
    <meta name="theme-color" content="#F6F4F1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0F0D0C" media="(prefers-color-scheme: dark)" />
    <!-- The web typeface (src/theme.ts). display=swap: text shows at once in the system
         font and changes face when the file lands, never invisible while it loads. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    />
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      /* The page colour before the app draws (theme.ts background), so the first frame is
         not a white flash; crisper type; no grey box on every tap on a phone browser. */
      body {
        background-color: #f6f4f1;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        -webkit-tap-highlight-color: transparent;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background-color: #0f0d0c;
        }
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript> You need to enable JavaScript to run this app. </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
